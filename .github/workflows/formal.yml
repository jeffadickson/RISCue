name: Formal verification
on:
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
        description: Run the full bounded core and ISA campaigns
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make formal-tools formal-fetch
      - run: make formal-model-tests formal-ecc formal-monitor formal-execute formal-ram
      - if: github.event_name == 'workflow_dispatch' && inputs.full
        run: make formal-fault formal-isa && python3 tools/run_formal.py cover
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-evidence
          path: build/formal/
