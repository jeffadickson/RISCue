# Start build/debug/sim/Vriscue_debug_soc first.
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9824
bindto 127.0.0.1
transport select jtag
adapter speed 1000
jtag newtap riscue cpu -irlen 5 -expected-id 0x00000001
set target riscue.cpu
target create $target riscv -chain-position $target
riscv set_mem_access sysbus
riscv set_command_timeout_sec 5
gdb_port 3333
tcl_port 6666
telnet_port 4444
init
halt
