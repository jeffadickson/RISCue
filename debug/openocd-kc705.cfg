# Supply your voltage-compatible adapter separately with -f interface/<adapter>.cfg.
# This target uses the dedicated FMC-LPC pins in boards/kc705/debug/debug.xdc.
bindto 127.0.0.1
transport select jtag
adapter speed 1000
reset_config none
jtag newtap riscue cpu -irlen 5 -expected-id 0x00000001
target create riscue.cpu riscv -chain-position riscue.cpu
riscv set_mem_access sysbus
init
halt
